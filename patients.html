<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12313a" />
    <meta name="description" content="Search, filter and add patient records in MediTrack." />
    <meta name="author" content="alishawhda" />
    <title>Patients · MediTrack</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-page="patients">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="navbar"></div>

    <main id="main" class="container">
      <header class="page-head d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
          <h1 class="h2 mb-0">Patients</h1>
          <p class="text-muted mb-0">Search and manage patient records.</p>
        </div>
        <button
          class="btn btn-teal"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#addModal"
        >
          <i class="bi bi-person-plus me-1" aria-hidden="true"></i>Add patient
        </button>
      </header>

      <section class="panel" aria-labelledby="patientListTitle">
        <h2 class="visually-hidden" id="patientListTitle">Patient records</h2>

        <div class="row g-2 mb-3">
          <div class="col-12 col-md-6">
            <label class="visually-hidden" for="search">Search patients</label>
            <input
              type="search"
              id="search"
              class="form-control"
              placeholder="Search by name, ID or condition"
            />
          </div>
          <div class="col-8 col-md-3">
            <label class="visually-hidden" for="statusFilter">Filter by status</label>
            <select id="statusFilter" class="form-select">
              <option value="All">All statuses</option>
              <option>Active</option>
              <option>Critical</option>
              <option>Discharged</option>
            </select>
          </div>
          <div class="col-4 col-md-3">
            <button id="resetData" class="btn btn-outline-secondary w-100" type="button">
              Reset data
            </button>
          </div>
        </div>

        <p id="count" class="small text-muted" aria-live="polite"></p>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <caption class="visually-hidden">
              Patient records with status, condition and treating doctor.
            </caption>
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Age</th>
                <th scope="col">Gender</th>
                <th scope="col">Condition</th>
                <th scope="col">Doctor</th>
                <th scope="col">Last visit</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="patientBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div
      class="modal fade"
      id="addModal"
      tabindex="-1"
      aria-labelledby="addTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <form class="modal-content" id="addForm" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="addTitle">Add patient</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div id="addError" class="alert alert-danger d-none" role="alert"></div>

            <div class="mb-3">
              <label class="form-label" for="pname">Full name</label>
              <input class="form-control" id="pname" name="pname" maxlength="80" required />
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label" for="page">Age</label>
                <input
                  type="number"
                  min="0"
                  max="120"
                  class="form-control"
                  id="page"
                  name="page"
                  required
                />
              </div>
              <div class="col-6">
                <label class="form-label" for="pgender">Gender</label>
                <select class="form-select" id="pgender" name="pgender">
                  <option value="">Choose…</option>
                  <option>Female</option>
                  <option>Male</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="pcondition">Condition</label>
              <select class="form-select" id="pcondition" name="pcondition">
                <option value="">Choose…</option>
                <option>Hypertension</option>
                <option>Diabetes</option>
                <option>Asthma</option>
                <option>Fracture</option>
                <option>Fever</option>
                <option>Cardiac</option>
              </select>
            </div>
            <div class="mb-1">
              <label class="form-label" for="pdoctor">Doctor</label>
              <select class="form-select" id="pdoctor" name="pdoctor">
                <option value="">Choose…</option>
                <option>Dr. Aisyah</option>
                <option>Dr. Hafiz</option>
                <option>Dr. Mei Ling</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn btn-teal">Save patient</button>
          </div>
        </form>
      </div>
    </div>

    <div id="footer"></div>
    <div id="toast" class="toast-mt d-none" role="status" aria-live="polite"></div>

    <script type="module" src="/src/js/pages/patients.js"></script>
  </body>
</html>
